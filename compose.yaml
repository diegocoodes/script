services:
  postgres:
    image: postgres:17-alpine
    container_name: deyvid-infotech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deyvid_infotech
      POSTGRES_USER: deyvid
      POSTGRES_PASSWORD: deyvid_local
    ports:
      - "5432:5432"
    volumes:
      - deyvid_infotech_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deyvid -d deyvid_infotech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deyvid_infotech_data:
